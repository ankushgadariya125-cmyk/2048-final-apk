name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          echo "plugins { id 'com.android.application' }
          android { namespace 'com.uberspot.a2048'; compileSdk 33; defaultConfig { applicationId 'com.uberspot.a2048'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.gms:play-services-ads:22.5.0' }" > app/build.gradle
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          mkdir -p app/src/main/java/com/uberspot/a2048 app/src/main/res/layout app/src/main/res/values
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="2048 Ads">
              <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8859848812165923~7042533958"/>
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          EOF
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Direct-APK-Download-Link, path: app/build/outputs/apk/debug/*.apk }
